<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Autonomous bug remediation</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header>
  <div class="brandblock">
    <span class="brand">Autonomous bug remediation</span>
    <a class="sub" id="repo" href="#" target="_blank" rel="noopener"></a>
  </div>
  <span class="grow"></span>
  <span class="muted small"><span class="dot live"></span>updated <span id="updated">–</span></span>
</header>
<main>

  <div class="grid g4">
    <div class="card stat"><h2>Open workflows</h2><div class="v" id="k-open">–</div><div class="d" id="k-open-sub">–</div></div>
    <div class="card stat"><h2>Active Devin sessions</h2><div class="v" id="k-sess">–</div><div class="d" id="k-sess-sub">–</div></div>
    <div class="card stat"><h2>Needs attention</h2><div class="v" id="k-attn">–</div><div class="d" id="k-attn-sub">–</div></div>
    <div class="card stat"><h2>Fixes</h2><div class="v" id="k-fix">–</div><div class="d" id="k-fix-sub">–</div></div>
  </div>
  <p class="small muted" style="margin:8px 0 14px">ACU = Agent Compute Unit — Devin's compute cost per session · <span id="acu-total">–</span> total.</p>

  <section class="card">
    <h2>Issues</h2>
    <div class="worklist" id="worklist"></div>
  </section>

</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ORDER=['QUEUED','DISCOVERED','TRIAGING','SKIPPED','INVESTIGATING','NEEDS_INFO','REPRODUCED','ROOT_CAUSE_FOUND','REMEDIATING','VERIFYING','PR_OPENED','CI_CHECKING','READY_FOR_REVIEW','COMPLETED','NOT_REPRODUCIBLE','BLOCKED','FAILED','ESCALATED'];
const OUTCOME={
  READY_FOR_REVIEW:['Ready for review','READY_FOR_REVIEW'],COMPLETED:['Merged','COMPLETED'],
  CI_CHECKING:['PR open · CI','CI_CHECKING'],PR_OPENED:['PR open','READY_FOR_REVIEW'],
  REMEDIATING:['Remediating','REMEDIATING'],VERIFYING:['Verifying','REMEDIATING'],
  INVESTIGATING:['Investigating','INVESTIGATING'],
  REPRODUCED:['Reproduced','REPRODUCED'],ROOT_CAUSE_FOUND:['Root cause found','REPRODUCED'],
  NEEDS_INFO:['Needs input','NEEDS_INFO'],BLOCKED:['Blocked','BLOCKED'],
  SKIPPED:['Skipped','SKIPPED'],NOT_REPRODUCIBLE:['Not reproducible','NOT_REPRODUCIBLE'],
  FAILED:['Failed','FAILED'],ESCALATED:['Escalated','ESCALATED'],
  TRIAGING:['Triaging','TRIAGING'],QUEUED:['Queued','QUEUED'],DISCOVERED:['New','DISCOVERED'],
};
function dur(s){if(s==null)return '–';s=Math.round(s);if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return (s/3600).toFixed(1)+'h';return (s/86400).toFixed(1)+'d'}
const OPEN=new Set();

function originTag(w){
  if(w.origin==='DEVIN_DISCOVERED')
    return `<span class="origin devin" title="Filed by Devin while investigating ${w.parent_issue_number?'#'+w.parent_issue_number:'another defect'}">✦ Devin${w.parent_issue_number?` · from <a href="/issues/${w.parent_issue_number}" onclick="event.stopPropagation()">#${w.parent_issue_number}</a>`:''}</span>`;
  return '';
}
function outcome(w){
  const [label,cls]=OUTCOME[w.state]||[w.state,''];
  return `<span class="pill ${cls}">${label}</span>`;
}
function prBadge(w){
  if(!w.pr_url)return '';
  const n=w.pr_url.split('/').pop();
  let icon,cls,label;
  if(w.state==='COMPLETED'){icon='●';cls='merged';label='merged'}
  else if(w.ci_status==='failed'){icon='✕';cls='fail';label='CI failing'}
  else if(w.ci_status==='passed'||w.state==='READY_FOR_REVIEW'){icon='✓';cls='ready';label='ready to merge'}
  else{icon='◌';cls='pending';label='CI '+(w.ci_status||'pending')}
  return `<a class="prst ${cls}" href="${esc(w.pr_url)}" target="_blank" onclick="event.stopPropagation()" title="PR #${n} · ${label}">${icon} PR #${n}</a>`;
}
// Five-step lifecycle; reproduction folds into Investigating, verification and
// CI fold into Remediating, and the last dashed step is defect-family analysis.
const STEPS=[
  ['Triaging',['DISCOVERED','TRIAGING']],
  ['Investigating',['QUEUED','INVESTIGATING','NEEDS_INFO','REPRODUCED','ROOT_CAUSE_FOUND']],
  ['Remediating',['REMEDIATING','VERIFYING','PR_OPENED','CI_CHECKING']],
  ['PR ready for review',['READY_FOR_REVIEW','COMPLETED']],
  ['Related defect analysis',[]],
];
const OFFTRACK={SKIPPED:0,NOT_REPRODUCIBLE:1,BLOCKED:1,FAILED:2,ESCALATED:2};
const SKIPLIKE={SKIPPED:1,NOT_REPRODUCIBLE:1};
function stepNote(w,i){
  const tri=w.triage||{},inv=w.investigation||{},rem=w.remediation||{},ana=w.analysis||{};
  if(i===0){
    if(w.state==='SKIPPED')return esc(tri.rationale||w.failure_reason||'skipped by triage');
    if(tri.verdict==='ACTIONABLE')return esc(tri.rationale||'actionable engineering defect');
    if(tri.verdict==='NEEDS_INFO')return 'asked reporter: '+esc(tri.clarification_question||'more information needed');
    if(tri.verdict)return esc(tri.verdict.toLowerCase());
    return '';
  }
  if(i===1){
    if(w.state==='NOT_REPRODUCIBLE')return 'could not reproduce — commented on the issue; a reply re-opens it';
    if(w.state==='NEEDS_INFO')return 'needs input: '+esc((inv.clarification_question||tri.clarification_question||w.failure_reason||''));
    if(inv.root_cause)return esc(inv.root_cause);
    if(inv.summary)return esc(inv.summary);
    return '';
  }
  if(i===2){
    if(rem.fix_summary||rem.summary)return esc(rem.fix_summary||rem.summary);
    if(w.ci_status&&w.state==='CI_CHECKING')return 'waiting on CI: '+esc(w.ci_status);
    return '';
  }
  if(i===3){
    if(w.state==='COMPLETED')return w.merged_without_changes?'merged without changes':'merged with follow-up commits';
    return w.ci_status==='passed'?'CI green — waiting on a reviewer':'';
  }
  if(i===4){
    if(ana.summary)return esc(ana.summary)+(ana.systemic_risk?` · ${esc(ana.systemic_risk)} risk`:'');
    return '';
  }
  return '';
}
function stepsHtml(w){
  const reached=new Set(w.reached||[]);reached.add(w.state);
  const off=OFFTRACK[w.state];
  let cur=-1;
  if(off===undefined)cur=STEPS.findIndex(([,ss])=>ss.includes(w.state));
  const anaDone=Object.keys(w.analysis||{}).length;
  const lis=STEPS.map(([label,ss],i)=>{
    let cls='',mark='';
    if(i===4){
      cls='retro';if(anaDone){cls+=' done';mark='✓'}
    }else if(off!==undefined){
      if(i<off){cls='done';mark='✓'}
      else if(i===off){if(SKIPLIKE[w.state]){cls='skip';mark='–'}else{cls='bad';mark='✗'}}
    }else{
      const done=i<cur||(cur!==-1&&w.state==='COMPLETED');
      if(done){cls='done';mark='✓'}
      else if(i===cur){cls='now'}
    }
    const note=stepNote(w,i);
    return `<li class="${cls}${i===4?' pre-retro':''}"><span class="mk">${mark}</span><div class="st-line"><span class="st-label">${label}</span>${note?`<span class="st-note">${note}</span>`:''}</div></li>`;
  }).join('');
  return `<ul class="milestones">${lis}</ul>`;
}
function sessionsHtml(w){
  const ss=(w.sessions||[]);
  if(!ss.length)return '';
  const roleLabel={triage:'Triage',investigator:'Investigator',remediator:'Remediator',analyst:'Retro',dedup:'Dedup check'};
  const roleOrder={triage:0,investigator:1,dedup:2,remediator:3,analyst:4};
  const sorted=[...ss].sort((a,b)=>(roleOrder[a.role]??9)-(roleOrder[b.role]??9));
  const real=/(?:devin-)?[0-9a-f]{32}/;
  return `<div class="sesslist small">${sorted.map(s=>{
    const label=roleLabel[s.role]||esc(s.role);
    return real.test(s.url||'')
      ? `<a class="sess" href="${esc(s.url)}" target="_blank" title="${esc(s.id)}">${label} ↗</a>`
      : `<span class="muted">${label}</span>`;
  }).join('<span class="muted"> · </span>')}</div>`;
}
function rowHtml(w){
  const n=w.issue_number;
  const waiting=w.waiting_for_seconds!=null?` · ${dur(w.waiting_for_seconds)}`:'';
  return `<div class="wl-item${OPEN.has(n)?' open':''}" data-n="${n}">
    <div class="wl-head">
      <span class="caret">▸</span>
      <span class="wl-title"><a href="/issues/${n}" onclick="event.stopPropagation()"><b>issue #${n}</b></a> ${esc(w.title||'')} ${originTag(w)} ${prBadge(w)}</span>
      <span class="wl-state">${outcome(w)}<span class="muted small">${waiting}</span></span>
    </div>
    <div class="wl-body">
      ${stepsHtml(w)}
      ${sessionsHtml(w)}
      <div class="wl-meta small muted">
        ${w.discovered_at?`discovered ${new Date(w.discovered_at).toLocaleDateString()}`:''}${w.failure_reason&&w.state!=='SKIPPED'?` · ${esc(w.failure_reason)}`:''}
      </div>
      <div class="small" style="margin-top:6px"><a href="/issues/${n}">Full detail →</a></div>
    </div>
  </div>`;
}
async function load(){
  const [m,ws,h]=await Promise.all([fetch('/api/metrics').then(r=>r.json()),fetch('/api/workflows').then(r=>r.json()),fetch('/healthz').then(r=>r.json())]);
  $('#repo').textContent='target repo: '+h.target_repo;
  $('#repo').href='https://github.com/'+h.target_repo;
  const e=m.executive||{},c=m.counts||{};
  $('#k-open').textContent=e.issues_open??'–';
  $('#k-open-sub').textContent=`${e.in_progress||0} active · ${e.awaiting_human||0} waiting`;
  $('#k-sess').textContent=m.active_sessions??'–';
  $('#k-sess-sub').textContent=`of ${m.max_concurrent||0} max`;
  $('#k-attn').textContent=(e.awaiting_input||0)+(e.awaiting_review||0);
  $('#k-attn-sub').textContent=`${e.awaiting_input||0} clarification · ${e.awaiting_review||0} review`+(e.awaiting_blocked?` · ${e.awaiting_blocked} blocked`:'');
  $('#k-fix').textContent=e.verified_fixes??'–';
  $('#k-fix-sub').textContent=`${c.READY_FOR_REVIEW||0} ready · ${c.COMPLETED||0} merged`;
  $('#acu-total').textContent=(+m.total_acus).toFixed(1);
  ws.sort((a,b)=>ORDER.indexOf(a.state)-ORDER.indexOf(b.state)||b.issue_number-a.issue_number);
  $('#worklist').innerHTML=ws.map(rowHtml).join('')||'<div class="muted" style="padding:12px 6px">No issues discovered yet. Open an issue in the target repo and it will be picked up automatically.</div>';
  $('#updated').textContent=new Date().toLocaleTimeString();
}
$('#worklist').addEventListener('click',e=>{
  const head=e.target.closest('.wl-head');
  if(!head||e.target.closest('a'))return;
  const item=head.parentElement,n=+item.dataset.n;
  item.classList.toggle('open');
  item.classList.contains('open')?OPEN.add(n):OPEN.delete(n);
});
load().catch(console.error);setInterval(()=>load().catch(console.error),5000);
</script>
</body></html>
