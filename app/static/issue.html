<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Issue · superset-x-devin</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header><a href="/">← Dashboard</a><h1 id="title">Issue</h1><span class="sub" id="state"></span><span class="grow"></span><span class="muted small" id="updated"></span></header>
<main>
  <div class="steps" id="steps"></div>
  <div class="grid g3">
    <div class="card"><h2>Issue</h2><div id="issue"></div></div>
    <div class="card"><h2>Devin sessions</h2><div id="sessions"></div></div>
    <div class="card"><h2>Outcome</h2><div id="outcome"></div></div>
  </div>
  <section class="grid g2">
    <div>
      <div class="card"><h2>Investigation (Investigator Devin)</h2><div id="inv"></div></div>
      <div class="card" style="margin-top:12px"><h2>Remediation &amp; verification (Remediator Devin)</h2><div id="rem"></div></div>
      <div class="card" style="margin-top:12px"><h2>Engineering analysis (Analyst Devin)</h2><div id="ana"></div></div>
    </div>
    <div class="card"><h2>Lifecycle timeline</h2><ul class="timeline" id="events"></ul></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const link=s=>esc(s).replace(/(https?:\/\/[^\s)]+)/g,'<a href="$1" target="_blank">$1</a>');
const STEPS=['QUEUED','INVESTIGATING','REPRODUCED','ROOT_CAUSE_FOUND','REMEDIATING','VERIFYING','PR_OPENED','READY_FOR_REVIEW'];
const BAD={NOT_REPRODUCIBLE:1,BLOCKED:1,FAILED:1,ESCALATED:1};
const number=location.pathname.split('/').pop();
const fmt=iso=>iso?new Date(iso).toLocaleString():'–';
const list=(a)=>Array.isArray(a)&&a.length?`<ul class="ev">${a.map(x=>`<li>${link(typeof x==='string'?x:JSON.stringify(x))}</li>`).join('')}</ul>`:'<span class="muted">–</span>';
const kv=(rows)=>`<table class="small"><tbody>${rows.map(([k,v])=>`<tr><td class="muted" style="width:38%">${k}</td><td>${v}</td></tr>`).join('')}</tbody></table>`;
async function load(){
  const h=await fetch('/healthz').then(r=>r.json());
  const w=await fetch(`/api/workflows/${h.target_repo}/${number}`).then(r=>{if(!r.ok)throw new Error('not found');return r.json()});
  $('#title').textContent=`#${w.issue_number} ${w.title||''}`;
  $('#state').innerHTML=`<span class="pill ${w.state}">${w.state.replace(/_/g,' ')}</span>`;
  const reached=new Set(w.events.map(e=>e.to_state));reached.add(w.state);
  $('#steps').innerHTML=STEPS.map(s=>`<div class="step ${s===w.state?'now':reached.has(s)?'done':''}">${s.replace(/_/g,' ')}</div>`).join('')+(BAD[w.state]||w.state==='NEEDS_INFO'||w.state==='COMPLETED'?`<div class="step ${BAD[w.state]?'bad':w.state==='COMPLETED'?'done':'now'}" style="grid-column:span 8">${w.state.replace(/_/g,' ')}${w.failure_reason?': '+esc(w.failure_reason):''}</div>`:'');
  $('#issue').innerHTML=kv([['Repo',esc(w.repo)],['Issue',`<a href="${esc(w.issue_url)}" target="_blank">${esc(w.issue_url)}</a>`],['Author',esc(w.author)],['Labels',(w.labels||[]).map(l=>`<span class="pill">${esc(l)}</span>`).join(' ')],['Discovered',fmt(w.discovered_at)],['Investigation started',fmt(w.started_at)],['Reproduced',fmt(w.reproduced_at)],['Root cause',fmt(w.root_cause_at)],['Remediation started',fmt(w.remediation_started_at)],['PR opened',fmt(w.pr_opened_at)],['Completed',fmt(w.completed_at)]]);
  $('#sessions').innerHTML=w.sessions.length?kv(w.sessions.map(s=>[esc(s.role),`<a href="${esc(s.url)}" target="_blank" class="mono">${esc(s.session_id)}</a><br><span class="muted small">${esc(s.devin_status||'')}${s.devin_status_detail?' · '+esc(s.devin_status_detail):''}${s.acus!=null?' · '+(+s.acus).toFixed(2)+' ACU':''}${s.active?' · <b>active</b>':''}</span>`])):'<span class="muted">none yet</span>';
  const inv=w.investigation||{},rem=w.remediation||{},ana=w.analysis||{};
  $('#outcome').innerHTML=kv([['PR',w.pr_url?`<a href="${esc(w.pr_url)}" target="_blank">${esc(w.pr_url)}</a>`:'–'],['Remediation attempts',w.remediation_attempts||0],['Needs-info kind',esc(w.needs_info_kind||'–')],['Waiting since',fmt(w.waiting_since)],['Failure / block reason',esc(w.failure_reason||'–')]]);
  $('#inv').innerHTML=Object.keys(inv).length?kv([['Status',esc(inv.status)],['Summary',esc(inv.summary)],['Expected',esc(inv.expected_behavior)],['Observed',esc(inv.observed_behavior)],['Reproduction steps',list(inv.reproduction_steps)],['Reproduction evidence',list(inv.reproduction_evidence)],['Root cause',`${esc(inv.root_cause)} <span class="muted">(${esc(inv.root_cause_confidence||'?')} confidence)</span>`],['Affected components',list(inv.affected_components)],['Verification plan',list(inv.verification_plan)],['Clarification question',esc(inv.clarification_question||'–')],['Missing information',list(inv.missing_information)]]):'<span class="muted">not yet available</span>';
  $('#rem').innerHTML=Object.keys(rem).length?kv([['Status',esc(rem.status)],['Fix',esc(rem.fix_summary||rem.summary)],['Files changed',list(rem.files_changed)],['Regression tests added',list(rem.regression_tests_added)],['Tests executed',Array.isArray(rem.tests_executed)&&rem.tests_executed.length?`<table class="small mono"><tbody>${rem.tests_executed.map(t=>`<tr><td>${esc(t.command)}</td><td><span class="pill ${t.result==='passed'?'COMPLETED':'FAILED'}">${esc(t.result)}</span></td></tr>`).join('')}</tbody></table>`:'–'],['Original reproduction re-run passed',rem.reproduction_rerun_passed?'yes':'no'],['Verification passed',rem.verification_passed?'yes':'no'],['Verification evidence',list(rem.verification_evidence)],['Blockers',list(rem.blockers)]]):'<span class="muted">not yet available</span>';
  $('#ana').innerHTML=Object.keys(ana).length?kv([['Systemic risk',esc(ana.systemic_risk)],['Summary',esc(ana.summary)],['Similar code locations',list(ana.similar_code_locations)],['Related issues',list(ana.related_issues)],['Missing engineering practice',esc(ana.missing_engineering_practice||'–')],['Recommended follow-up',`${esc(ana.followup_type||'')} — ${esc(ana.recommended_followup||'')}`],['Follow-up issue',ana.followup_issue_url?`<a href="${esc(ana.followup_issue_url)}" target="_blank">${esc(ana.followup_issue_url)}</a>`:'–']]):'<span class="muted">not yet available</span>';
  $('#events').innerHTML=w.events.map(e=>{const d=typeof e.detail==='string'?e.detail:e.detail?JSON.stringify(e.detail):'';return `<li><span class="muted small">${fmt(e.at)}</span><span><b>${esc(e.kind)}</b>${e.to_state?` <span class="pill ${e.to_state}">${e.to_state.replace(/_/g,' ')}</span>`:''}${d?`<div class="muted small">${link(d.slice(0,300))}</div>`:''}</span></li>`}).join('');
  $('#updated').textContent='updated '+new Date().toLocaleTimeString();
}
load().catch(e=>{$('#title').textContent='Workflow not found'});setInterval(()=>load().catch(()=>{}),5000);
</script>
</body></html>
