<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>issue · superset-x-devin</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header><a href="/">← Dashboard</a></header>
<main id="wmain">
  <div class="muted">Loading…</div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const REAL=/(?:devin-)?[0-9a-f]{32}/;
const ROLE={triage:'Triage',investigator:'Investigator',remediator:'Remediator',analyst:'Retro',dedup:'Dedup check'};
const OWNER={
  DISCOVERED:'Queue',TRIAGING:'Triage Devin',QUEUED:'Queue',
  INVESTIGATING:'Investigator Devin',REPRODUCED:'Investigator Devin',ROOT_CAUSE_FOUND:'Investigator Devin',
  NEEDS_INFO:'Reporter',BLOCKED:'Human',
  REMEDIATING:'Remediator Devin',VERIFYING:'Remediator Devin',PR_OPENED:'Remediator Devin',
  CI_CHECKING:'GitHub CI',READY_FOR_REVIEW:'Reviewer',
  COMPLETED:'—',SKIPPED:'—',NOT_REPRODUCIBLE:'—',FAILED:'Human',ESCALATED:'Human'};
const STAGE={
  READY_FOR_REVIEW:'Ready for review',COMPLETED:'Merged',CI_CHECKING:'CI checking',PR_OPENED:'PR open',
  REMEDIATING:'Remediating',VERIFYING:'Verifying',INVESTIGATING:'Investigating',REPRODUCED:'Reproduced',
  ROOT_CAUSE_FOUND:'Root cause found',NEEDS_INFO:'Needs input',BLOCKED:'Blocked',SKIPPED:'Skipped',
  NOT_REPRODUCIBLE:'Not reproducible',FAILED:'Failed',ESCALATED:'Escalated',TRIAGING:'Triaging',
  QUEUED:'Queued',DISCOVERED:'New'};
function ago(iso){if(!iso)return '–';const s=(Date.now()-new Date(iso))/1000;
  if(s<60)return Math.floor(s)+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return (s/3600).toFixed(1)+'h ago';return new Date(iso).toLocaleDateString()}
function sessLink(s,label){
  if(!s)return '';
  const txt=label||`${ROLE[s.role]||s.role} session ↗`;
  return REAL.test(s.url||'')
    ? `<a href="${esc(s.url)}" target="_blank">${txt}</a>`
    : `<span class="muted">${txt.replace(' ↗','')}</span>`;
}

async function load(){
  const n=location.pathname.split('/').pop();
  const w=await fetch(`/api/workflows/${window.repo}/${n}`).then(r=>r.json());
  const ss=w.sessions||[];
  const byRole=r=>ss.filter(s=>s.role===r).pop();
  const tri=w.triage||{},inv=w.investigation||{},rem=w.remediation||{},ana=w.analysis||{};
  const devin=w.origin==='DEVIN_DISCOVERED';

  // ---------- header ----------
  const origin=devin&&w.parent?`Devin-discovered · from <a href="/issues/${w.parent.issue_number}">#${w.parent.issue_number}</a>`
    :devin?'Devin-discovered':`Reported by ${esc(w.author||'human')}`;
  document.title=`#${n} · superset-x-devin`;
  $('#wmain').innerHTML=`
    <div class="card head">
      <a class="title" href="${esc(w.issue_url)}" target="_blank">issue #${n} — ${esc(w.title||'')}</a>
      <div class="meta">${origin} · <span class="pill ${w.state}">${STAGE[w.state]||w.state}</span> · owner: ${esc(OWNER[w.state]||'—')} · discovered ${ago(w.discovered_at)}</div>
    </div>
    ${devin?`<div class="card prov"><h2>Discovered during analysis${w.parent?` of <a href="/issues/${w.parent.issue_number}">#${w.parent.issue_number}</a>`:''}</h2>
      <div>${esc(ana.summary||tri.rationale||'Similar defect pattern found during related-defect analysis')}</div>
      <div style="margin-top:8px">${sessLink(byRole('analyst'),'Open analyst session →')||''}</div>
    </div>`:''}
    <div class="card"><h2>Progress</h2><ul class="milestones" id="steps"></ul></div>
    <div class="card" id="evidence"></div>`;

  // ---------- tracker ----------
  const STEPS=[['Triaging',['DISCOVERED','TRIAGING']],['Investigating',['QUEUED','INVESTIGATING','NEEDS_INFO','REPRODUCED','ROOT_CAUSE_FOUND']],['Remediating',['REMEDIATING','VERIFYING','PR_OPENED','CI_CHECKING']],['PR ready for review',['READY_FOR_REVIEW','COMPLETED']],['Related defect analysis',[]]];
  const OFFTRACK={SKIPPED:0,NOT_REPRODUCIBLE:1,BLOCKED:1,FAILED:2,ESCALATED:2};
  const SKIPLIKE={SKIPPED:1,NOT_REPRODUCIBLE:1};
  const off=OFFTRACK[w.state];
  const cur=off===undefined?STEPS.findIndex(([,s])=>s.includes(w.state)):-1;
  const anaDone=Object.keys(ana).length||ss.some(s=>s.role==='analyst');
  function note(i){
    if(i===0){
      if(w.state==='SKIPPED')return esc(tri.rationale||w.failure_reason||'skipped by triage');
      if(tri.verdict==='ACTIONABLE')return esc(tri.rationale||'actionable engineering defect');
      if(tri.verdict==='NEEDS_INFO')return 'asked reporter: '+esc(tri.clarification_question||'more information needed');
      if(tri.verdict)return esc(tri.verdict.toLowerCase());
      return '';
    }
    if(i===1){
      if(w.state==='NOT_REPRODUCIBLE')return 'could not reproduce — needs a better report or more detail';
      if(w.state==='NEEDS_INFO')return 'needs input: '+esc(inv.clarification_question||tri.clarification_question||w.failure_reason||'');
      if(inv.root_cause)return esc(inv.root_cause);
      if(inv.summary)return esc(inv.summary);
      return '';
    }
    if(i===2){
      if(rem.fix_summary||rem.summary)return esc(rem.fix_summary||rem.summary);
      if(w.ci_status&&w.state==='CI_CHECKING')return 'waiting on CI: '+esc(w.ci_status);
      return '';
    }
    if(i===3){
      if(w.state==='COMPLETED')return w.merged_without_changes?'merged without changes':'merged with follow-up commits';
      return w.ci_status==='passed'?'CI green — waiting on a reviewer':'';
    }
    if(i===4){
      if(ana.summary)return esc(ana.summary)+(ana.systemic_risk?` · ${esc(ana.systemic_risk)} risk`:'');
      return '';
    }
    return '';
  }
  $('#steps').innerHTML=STEPS.map(([label,st],i)=>{
    let cls='',mark='';
    if(i===4){cls='retro pre-retro';if(anaDone){cls+=' done';mark='✓'}}
    else if(off!==undefined){
      if(i<off){cls='done';mark='✓'}
      else if(i===off){cls=SKIPLIKE[w.state]?'skip':'bad';mark=SKIPLIKE[w.state]?'–':'✗'}
    }else{
      if(i<cur||w.state==='COMPLETED'){cls='done';mark='✓'}
      else if(i===cur){cls='now'}
    }
    const role=['triage','investigator','remediator',null,'analyst'][i];
    const link=role?sessLink(byRole(role),'Devin session ↗'):'';
    const pr=i===3&&w.pr_url?` <a class="prst ${w.state==='COMPLETED'?'merged':w.ci_status==='passed'||w.state==='READY_FOR_REVIEW'?'ready':w.ci_status==='failed'?'fail':'pending'}" href="${esc(w.pr_url)}" target="_blank">#${w.pr_number||''}</a>`:'';
    const n=note(i);
    return `<li class="${cls}"><span class="mk">${mark}</span><div class="st-line"><span class="st-label">${label} ${link}${pr}</span>${n?`<span class="st-note">${n}</span>`:''}</div></li>`;
  }).join('');

  // ---------- evidence panel: one compact box, stage-appropriate ----------
  const E=[];
  const working=['DISCOVERED','TRIAGING','QUEUED','INVESTIGATING','REMEDIATING','VERIFYING'].includes(w.state);
  if(working){
    const doing={DISCOVERED:'Waiting for triage to start',TRIAGING:'Deciding whether this is an actionable defect',
      QUEUED:'Queued for investigation',INVESTIGATING:'Reproducing the reported behavior in the repo',
      REMEDIATING:'Writing the fix and regression tests',VERIFYING:'Re-running the original reproduction'}[w.state];
    E.push(`<h2>Current work</h2><div class="kv-v"><b>${esc(OWNER[w.state]||'')}</b> — ${doing}</div>
      <div style="margin-top:8px">${sessLink(ss.find(s=>s.active)||byRole('investigator')||byRole('triage')||byRole('remediator'),'Open Devin session →')}</div>`);
  }
  if(Object.keys(inv).length||w.state==='NEEDS_INFO'||w.state==='NOT_REPRODUCIBLE'){
    E.push(`<h2>Investigation</h2>
      ${inv.reproduced!=null?`<div>Reproduced ${inv.reproduced?'✓':'✗'}</div>`:''}
      ${inv.root_cause?`<div>Root cause: ${esc(inv.root_cause)}</div>`:''}
      ${inv.expected_behavior?`<div class="muted small">Expected: ${esc(inv.expected_behavior)}</div>`:''}
      ${inv.observed_behavior?`<div class="muted small">Observed: ${esc(inv.observed_behavior)}</div>`:''}
      ${(inv.reproduction_evidence||[]).length?`<ul class="ev">${inv.reproduction_evidence.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:''}
      ${sessLink(byRole('investigator'),'Open investigation →')}`);
  }
  if(Object.keys(rem).length){
    E.push(`<h2>Fix</h2>
      ${w.pr_url?`<div><a href="${esc(w.pr_url)}" target="_blank">PR #${w.pr_number||''} ↗</a></div>`:''}
      ${rem.fix_summary||rem.summary?`<div>${esc(rem.fix_summary||rem.summary)}</div>`:''}
      ${(rem.regression_tests_added||[]).length?`<div>Regression tests added ✓</div>`:''}
      ${rem.reproduction_rerun_passed?`<div>Original reproduction passes ✓</div>`:''}
      ${w.ci_status?`<div>CI: ${esc(w.ci_status)}</div>`:''}
      ${sessLink(byRole('remediator'),'Open remediation →')}`);
  }
  if(Object.keys(ana).length){
    E.push(`<h2>Related defects</h2>
      ${ana.summary?`<div>${esc(ana.summary)}</div>`:''}
      ${ana.systemic_risk?`<div class="muted small">Systemic risk: ${esc(ana.systemic_risk)}</div>`:''}
      ${(ana.similar_code_locations||[]).length?`<ul class="ev">${ana.similar_code_locations.map(i=>`<li><code>${esc(i)}</code></li>`).join('')}</ul>`:''}
      ${ana.followup_issue_url?`<div><a href="${esc(ana.followup_issue_url)}" target="_blank">follow-up issue ↗</a></div>`:''}
      ${sessLink(byRole('analyst'),'Open analyst session →')}`);
  }
  const ev=$('#evidence');
  if(E.length){ev.innerHTML=E.join('')}else{ev.remove()}
}
async function main(){
  const h=await fetch('/healthz').then(r=>r.json());window.repo=h.target_repo;
  await load();
}
main().catch(e=>{$('#wmain').innerHTML='<div class="muted">'+esc(e)+'</div>'});
</script>
</body></html>
