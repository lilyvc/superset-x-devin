<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Issue · superset-x-devin</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header><a href="/">← Dashboard</a></header>
<main>
  <div class="card" id="issuehead" style="max-width:760px;margin-bottom:14px;display:none">
    <a id="title" href="#" target="_blank" style="font-weight:600;font-size:16px"></a>
    <div class="small" id="meta" style="margin-top:4px"></div>
    <div id="children"></div>
  </div>
  <div class="card" style="max-width:760px">
    <ul class="milestones" id="steps" style="margin:4px 0 0"></ul>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const real=/(?:devin-)?[0-9a-f]{32}/;
const STEPS=[
  ['Triaging','triage',['DISCOVERED','TRIAGING']],
  ['Investigating','investigator',['QUEUED','INVESTIGATING','NEEDS_INFO','REPRODUCED','ROOT_CAUSE_FOUND']],
  ['Remediating','remediator',['REMEDIATING','VERIFYING','PR_OPENED','CI_CHECKING']],
  ['PR ready for review',null,['READY_FOR_REVIEW','COMPLETED']],
];
const OFFTRACK={SKIPPED:0,NOT_REPRODUCIBLE:1,BLOCKED:1,FAILED:2,ESCALATED:2};
const SKIPLIKE={SKIPPED:1,NOT_REPRODUCIBLE:1};
const number=location.pathname.split('/').pop();
const stepSession=(w,role)=>{
  const list=(w.sessions||[]).filter(s=>s.role===role);
  const s=list[list.length-1];
  return s&&real.test(s.url||'')?`<a class="sess" href="${esc(s.url)}" target="_blank" title="${esc(s.session_id)}">↗</a>`:'';
};
const prBadge=w=>{
  if(!w.pr_url)return '';
  const pr=w.pr_url.split('/').pop();
  let icon,cls,label;
  if(w.state==='COMPLETED'){icon='●';cls='merged';label='merged'}
  else if(w.ci_status==='failed'){icon='✕';cls='fail';label='CI failing'}
  else if(w.ci_status==='passed'||w.state==='READY_FOR_REVIEW'){icon='✓';cls='ready';label='CI green'}
  else{icon='◌';cls='pending';label='CI '+(w.ci_status||'pending')}
  return `<a class="prst ${cls}" href="${esc(w.pr_url)}" target="_blank" title="PR #${pr} · ${label}">${icon} PR #${pr}</a>`;
};
function stepNote(w,i){
  const tri=w.triage||{},inv=w.investigation||{},rem=w.remediation||{},ana=w.analysis||{};
  if(i===0){
    if(w.state==='SKIPPED')return esc(tri.rationale||w.failure_reason||'skipped by triage');
    if(tri.verdict==='ACTIONABLE')return esc(tri.rationale||'actionable engineering defect');
    if(tri.verdict==='NEEDS_INFO')return 'asked reporter: '+esc(tri.clarification_question||'more information needed');
    if(tri.verdict)return esc(tri.verdict.toLowerCase());
    return '';
  }
  if(i===1){
    if(w.state==='NOT_REPRODUCIBLE')return 'could not reproduce — needs a better report or more detail';
    if(w.state==='NEEDS_INFO')return 'needs input: '+esc((inv.clarification_question||tri.clarification_question||w.failure_reason||''));
    if(inv.root_cause)return esc(inv.root_cause);
    if(inv.summary)return esc(inv.summary);
    return '';
  }
  if(i===2){
    const fix=rem.fix_summary||rem.summary;
    if(w.state==='CI_CHECKING'||w.state==='PR_OPENED')
      return (fix?esc(fix)+' · ':'')+'waiting on CI'+(w.ci_status?': '+esc(w.ci_status):'');
    if(fix)return esc(fix);
    return '';
  }
  if(i===3){
    if(w.state==='COMPLETED')return w.merged_without_changes?'merged without changes':'merged with follow-up commits';
    return w.ci_status==='passed'?'CI green — waiting on a reviewer':'';
  }
  if(i===4){
    const kids=(w.children||[]);
    const parts=[];
    if(ana.systemic_risk&&ana.systemic_risk!=='none')parts.push(esc(ana.systemic_risk)+' systemic risk');
    if(ana.summary)parts.push(esc(ana.summary));
    if(kids.length)parts.push(`${kids.length} related defect${kids.length>1?'s':''} found`);
    if(ana.followup_issue_url)parts.push(`<a href="${esc(ana.followup_issue_url)}" target="_blank">follow-up issue →</a>`);
    return parts.join(' · ');
  }
  return '';
}
function retroDetail(ana){
  if(!ana||!Object.keys(ana).length)return '';
  const rows=[];
  const add=(k,v)=>{if(v!=null&&v!==''&&!(Array.isArray(v)&&!v.length))rows.push(`<div style="margin:3px 0"><b class="muted">${k}</b> ${v}</div>`)};
  add('Summary',esc(ana.summary));
  add('Systemic risk',esc(ana.systemic_risk));
  add('Same pattern found in',(ana.similar_code_locations||[]).map(esc).join('<br>'));
  add('Related issues',(ana.related_issues||[]).map(esc).join(', '));
  add('Recommended follow-up',esc(ana.recommended_followup));
  if(ana.followup_issue_url)add('Follow-up issue',`<a href="${esc(ana.followup_issue_url)}" target="_blank">${esc(ana.followup_issue_url)}</a>`);
  return rows.length?`<details class="small" style="margin-top:4px"><summary style="cursor:pointer">Retro results</summary><div style="margin-top:6px">${rows.join('')}</div></details>`:'';
}
function stepsHtml(w){
  const off=OFFTRACK[w.state];
  const cur=off===undefined?STEPS.findIndex(([,,ss])=>ss.includes(w.state)):-1;
  const lis=STEPS.map(([label,role,ss],i)=>{
    let cls='pre-retro',mark='';
    if(off!==undefined){
      if(i<off){cls+=' done';mark='✓'}
      else if(i===off){
        if(SKIPLIKE[w.state]){cls+=' skip';mark='–'}
        else{cls+=' bad';mark='✗'}
      }
    }else{
      const done=i<cur||w.state==='COMPLETED';
      if(done){cls+=' done';mark='✓'}
      else if(i===cur){cls+=' now'}
    }
    const note=stepNote(w,i);
    const sess=role?stepSession(w,role):'';
    const badge=i===3?(' '+prBadge(w)):'';
    return `<li class="${cls}"><span class="mk">${mark}</span><div class="st-line"><span class="st-label">${label}${sess?' '+sess:''}${badge}</span>${note?`<span class="st-note">${note}</span>`:''}</div></li>`;
  });
  // 5th step: Retrospecting — dashed, extra to the remediation flow.
  const anaSess=stepSession(w,'analyst');
  const ana=w.analysis||{};
  const retroSess=(w.sessions||[]).filter(s=>s.role==='analyst');
  const retroActive=retroSess.some(s=>s.active);
  let rcls='retro',rmark='';
  if(Object.keys(ana).length||(retroSess.length&&!retroActive)){rcls+=' done';rmark='✓'}
  else if(retroActive){rcls+=' now'}
  const rnote=stepNote(w,4);
  lis.push(`<li class="${rcls}"><span class="mk">${rmark}</span><div class="st-line"><span class="st-label">Retrospecting${anaSess?' '+anaSess:''}</span>${rnote?`<span class="st-note">${rnote}</span>`:''}${retroDetail(ana)}</div></li>`);
  return lis.join('');
}
async function load(){
  const h=await fetch('/healthz').then(r=>r.json());
  const w=await fetch(`/api/workflows/${h.target_repo}/${number}`).then(r=>{if(!r.ok)throw new Error('not found');return r.json()});
  const when=w.discovered_at?new Date(w.discovered_at).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
  $('#title').textContent=`issue #${w.issue_number} ${w.title||''}`;
  $('#title').href=w.issue_url||'#';
  const who=w.origin==='DEVIN_DISCOVERED'
    ?'filed by Retro Devin'+(w.parent?` while investigating <a href="/issues/${w.parent.issue_number}">#${w.parent.issue_number}</a>`:'')
    :'opened by '+esc(w.author||'a reporter');
  $('#meta').innerHTML=`<span class="pill ${w.state}">${w.state.replace(/_/g,' ')}</span> <span class="muted">· ${who}${when?` · ${when}`:''}</span>`;
  $('#children').innerHTML=(w.children||[]).map(c=>
    `<div class="small" style="margin-top:4px">└ <span class="origin devin">✦ related defect discovered</span> <a href="/issues/${c.issue_number}">#${c.issue_number} ${esc(c.title||'')}</a> <span class="pill ${c.state}">${c.state.replace(/_/g,' ')}</span></div>`
  ).join('');
  $('#issuehead').style.display='';
  $('#steps').innerHTML=stepsHtml(w);
}
load().catch(()=>{$('#issuehead').style.display='';$('#title').textContent='Workflow not found'});setInterval(()=>load().catch(()=>{}),5000);
</script>
</body></html>
