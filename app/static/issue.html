<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Issue · superset-x-devin</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header><a href="/">← Dashboard</a><h1 id="title">Issue</h1><span class="sub" id="state"></span></header>
<main>
  <div class="card" id="provenance" style="display:none;margin-bottom:14px"></div>
  <div class="card" style="max-width:760px">
    <ul class="milestones" id="steps" style="margin:4px 0 14px"></ul>
    <div class="sesslist small" id="sessions"></div>
    <div class="small" id="links" style="margin-top:12px"></div>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STEPS=[
  ['Triaging',['DISCOVERED','TRIAGING']],
  ['Investigating',['QUEUED','INVESTIGATING','NEEDS_INFO','REPRODUCED','ROOT_CAUSE_FOUND']],
  ['Remediating',['REMEDIATING','VERIFYING','PR_OPENED','CI_CHECKING']],
  ['PR ready for review',['READY_FOR_REVIEW','COMPLETED']],
];
const OFFTRACK={SKIPPED:0,NOT_REPRODUCIBLE:1,BLOCKED:1,FAILED:2,ESCALATED:2};
const number=location.pathname.split('/').pop();
function stepNote(w,i){
  const tri=w.triage||{},inv=w.investigation||{},rem=w.remediation||{};
  if(i===0){
    if(w.state==='SKIPPED')return esc(tri.rationale||w.failure_reason||'skipped by triage');
    if(tri.verdict==='ACTIONABLE')return esc(tri.rationale||'actionable engineering defect');
    if(tri.verdict==='NEEDS_INFO')return 'asked reporter: '+esc(tri.clarification_question||'more information needed');
    if(tri.verdict)return esc(tri.verdict.toLowerCase());
    return '';
  }
  if(i===1){
    if(w.state==='NOT_REPRODUCIBLE')return 'could not reproduce — needs a better report or more detail';
    if(w.state==='NEEDS_INFO')return 'needs input: '+esc((inv.clarification_question||tri.clarification_question||w.failure_reason||''));
    if(inv.root_cause)return esc(inv.root_cause);
    if(inv.summary)return esc(inv.summary);
    return '';
  }
  if(i===2){
    if(rem.fix_summary||rem.summary)return esc(rem.fix_summary||rem.summary);
    if(w.ci_status&&w.state==='CI_CHECKING')return 'waiting on CI: '+esc(w.ci_status);
    return '';
  }
  if(i===3){
    if(w.state==='COMPLETED')return w.merged_without_changes?'merged without changes':'merged with follow-up commits';
    return w.ci_status==='passed'?'CI green — waiting on a reviewer':'';
  }
  return '';
}
function stepsHtml(w){
  const reached=new Set(w.events.map(e=>e.to_state));reached.add(w.state);
  const off=OFFTRACK[w.state];
  const cur=off===undefined?STEPS.findIndex(([,ss])=>ss.includes(w.state)):-1;
  return STEPS.map(([label,ss],i)=>{
    let cls='',mark='';
    if(off!==undefined){
      if(i<off){cls='done';mark='✓'}
      else if(i===off){cls='bad';mark='✗'}
    }else{
      const done=i<cur||w.state==='COMPLETED';
      if(done){cls='done';mark='✓'}
      else if(i===cur){cls='now'}
    }
    const note=stepNote(w,i);
    return `<li class="${cls}"><span class="mk">${mark}</span><div class="st-line"><span class="st-label">${label}</span>${note?`<span class="st-note">${note}</span>`:''}</div></li>`;
  }).join('');
}
async function load(){
  const h=await fetch('/healthz').then(r=>r.json());
  const w=await fetch(`/api/workflows/${h.target_repo}/${number}`).then(r=>{if(!r.ok)throw new Error('not found');return r.json()});
  $('#title').textContent=`Issue #${w.issue_number} ${w.title||''}`;
  $('#state').innerHTML=`<span class="pill ${w.state}">${w.state.replace(/_/g,' ')}</span>`;
  const rows=[];
  if(w.origin==='DEVIN_DISCOVERED'){
    rows.push(`<div><span class="origin devin">✦ Devin-discovered</span> — a related defect found while investigating ${w.parent?`<a href="/issues/${w.parent.issue_number}">#${w.parent.issue_number} ${esc(w.parent.title||'')}</a>`:'another issue'}</div>`);
  }else{
    rows.push('<div>Opened by a human reporter</div>');
  }
  (w.children||[]).forEach(c=>{
    rows.push(`<div class="small" style="margin-left:18px">└ <span class="origin devin">✦ related defect discovered</span> <a href="/issues/${c.issue_number}">#${c.issue_number} ${esc(c.title||'')}</a> <span class="pill ${c.state}">${c.state.replace(/_/g,' ')}</span></div>`);
  });
  if(rows.length){$('#provenance').style.display='';$('#provenance').innerHTML=rows.join('');}
  $('#steps').innerHTML=stepsHtml(w);
  const roleLabel={triage:'Triage Devin',investigator:'Investigator Devin',remediator:'Remediator Devin',analyst:'Analyst Devin',dedup:'Dedup check'};
  const real=/(?:devin-)?[0-9a-f]{32}/;
  $('#sessions').innerHTML=(w.sessions||[]).map(s=>
    real.test(s.session_id||'')
      ? `<a class="sess" href="${esc(s.url)}" target="_blank" title="${esc(s.session_id)}">${roleLabel[s.role]||esc(s.role)} ↗</a>`
      : `<span class="muted">${roleLabel[s.role]||esc(s.role)}</span>`
  ).join('<span class="muted"> · </span>')||'<span class="muted">no sessions yet</span>';
  const links=[];
  if(w.issue_url)links.push(`<a href="${esc(w.issue_url)}" target="_blank">GitHub issue →</a>`);
  if(w.pr_url)links.push(`<a href="${esc(w.pr_url)}" target="_blank">Pull request →</a>${w.ci_status?` <span class="muted">CI: ${esc(w.ci_status)}</span>`:''}`);
  $('#links').innerHTML=links.join(' &nbsp;·&nbsp; ');
}
load().catch(()=>{$('#title').textContent='Workflow not found'});setInterval(()=>load().catch(()=>{}),5000);
</script>
</body></html>
